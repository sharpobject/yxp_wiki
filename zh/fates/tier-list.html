  <main><section id="tier-maker" data-language="zh">
<div class="tl-hero"><div><div class="tl-eyebrow">选择 · 排名 · 分享</div><h1>天衍万象仙命梯度榜</h1><p>你的角色，你的排名。 <span class="muted">将下方仙命拖入 S–D 梯度，自由调整顺序，再分享你的榜单。</span></p></div></div>
<div class="tl-tools"><label>角色<select id="tl-character"></select></label><label class="tl-title-field">榜单标题<input id="tl-title" maxlength="120" placeholder="我的天衍万象仙命梯度榜"></label><button class="tl-button primary" id="tl-share">复制分享链接</button></div>
<div class="tl-actions"><button class="tl-button" id="tl-undo" disabled>撤销</button><button class="tl-button" id="tl-redo" disabled>重做</button><button class="tl-button" id="tl-reset">重置排名</button><span class="tl-count" id="tl-progress"></span></div>
<p class="tl-status" id="tl-status" role="status" aria-live="polite"></p><input class="tl-share" id="tl-share-url" readonly hidden aria-label="复制分享链接">
<h2 class="tl-view-title" id="tl-view-title" hidden></h2><div class="tl-board"><div class="tl-row"><button class="tl-rank" data-move="S" style="--tier:#f08080" aria-label="S">S</button><div class="tl-zone" data-tier="S" role="group" aria-label="S" data-hint="将仙命拖到这里"></div></div><div class="tl-row"><button class="tl-rank" data-move="A" style="--tier:#f5b779" aria-label="A">A</button><div class="tl-zone" data-tier="A" role="group" aria-label="A" data-hint="将仙命拖到这里"></div></div><div class="tl-row"><button class="tl-rank" data-move="B" style="--tier:#f4d779" aria-label="B">B</button><div class="tl-zone" data-tier="B" role="group" aria-label="B" data-hint="将仙命拖到这里"></div></div><div class="tl-row"><button class="tl-rank" data-move="C" style="--tier:#b9db85" aria-label="C">C</button><div class="tl-zone" data-tier="C" role="group" aria-label="C" data-hint="将仙命拖到这里"></div></div><div class="tl-row"><button class="tl-rank" data-move="D" style="--tier:#86c7a0" aria-label="D">D</button><div class="tl-zone" data-tier="D" role="group" aria-label="D" data-hint="将仙命拖到这里"></div></div></div>
